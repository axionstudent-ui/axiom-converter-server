services:
  - type: web
    name: axiom-converter
    env: python
    region: oregon
    plan: free
    buildCommand: |
      apt-get update -qq &&
      apt-get install -y -qq libreoffice ghostscript &&
      pip install --quiet -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: PORT
        value: 5000
    autoDeploy: true
